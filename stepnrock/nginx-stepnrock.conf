# ============================================================
# STEP N ROCK — Nginx (host: stepnrock.get4domain.com → app on 127.0.0.1:3015)
# Live file on the VM: /etc/nginx/sites-available/stepnrock
#   sudo ln -s /etc/nginx/sites-available/stepnrock /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT — Cloudflare SSL/TLS mode on this zone is "Flexible" (Cloudflare
# terminates HTTPS to visitors using ITS OWN certificate; Cloudflare<->origin
# stays plain HTTP). So the origin must SERVE plain HTTP on :80 and must NOT
# force an HTTP->HTTPS redirect - otherwise Cloudflare (HTTP) <-> origin
# (301->HTTPS) loops forever. This mirrors the working ksmquantum /
# get4domain_mvp / mrtravels blocks exactly (same fix already applied there).
#
# DO NOT run `certbot --nginx -d stepnrock.get4domain.com` on this VM. It
# inserts a port-80 "return 301 https://..." redirect, which causes that
# exact loop under Flexible mode (already hit and fixed once for ksmquantum
# - see ksm-quantum/nginx-ksmquantum.conf). You also do NOT need an origin
# certificate for the site to be served over https:// to visitors: Cloudflare
# supplies its own edge certificate under Flexible mode. Just enable this
# vhost as plain HTTP and reload nginx - nothing else required.
# ============================================================

server {
    listen 80;
    server_name stepnrock.get4domain.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://localhost:3015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static {
        proxy_pass http://localhost:3015;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
