services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://gapi.get4domain.com
        # The public origin used for canonical / Open Graph / sitemap URLs. Put the shop's own domain here once it points at this server.
        - SITE_URL=${SITE_URL:-https://stepnrock.get4domain.com}
    container_name: stepnrock
    restart: unless-stopped
    ports:
      - "3015:3015"
    environment:
      - NODE_ENV=production
      - PORT=3015
      - NEXT_PUBLIC_API_URL=https://gapi.get4domain.com
      - SITE_URL=${SITE_URL:-https://stepnrock.get4domain.com}
    networks:
      - stepnrock_net

networks:
  stepnrock_net:
    driver: bridge
