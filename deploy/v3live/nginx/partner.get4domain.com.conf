# partner.get4domain.com -> the partner portal SPA container (E1c). Install as /etc/nginx/sites-available/partner.get4domain.com.conf, then fill the __PLACEHOLDERS__ (RUNBOOK.md).
# The container sends its own Content-Security-Policy; this block adds none (see snippets/g4d-headers-spa.conf). Never indexed.
server {
    listen 80;
    listen [::]:80;
    server_name partner.get4domain.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partner.get4domain.com;
    server_tokens off;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/cloudflare-realip.conf;
    include snippets/g4d-gzip.conf;

    client_max_body_size 1m;

    access_log /var/log/nginx/partner.get4domain.com.access.log;
    error_log  /var/log/nginx/partner.get4domain.com.error.log;

    location / {
        proxy_pass http://__V3_BIND_IP__:3103;
        include snippets/g4d-proxy.conf;
        include snippets/g4d-headers-spa.conf;
    }
}
