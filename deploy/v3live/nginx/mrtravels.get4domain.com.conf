# mrtravels.get4domain.com: the EXPLICIT rule that keeps this V2 client on its own app after the wildcard moves (E1c). Install ONLY IF no server block for this name exists today
# (check with: nginx -T | grep -n "server_name.*mrtravels"). If one exists, leave it alone; it already does the job.
#   __MRTRAVELS_UPSTREAM__   where MR Travels runs today, for example http://127.0.0.1:<port>. The owner fills it; it is never guessed. nginx -t FAILS until it is filled, on purpose.
#   __TLS_CERT__ / __TLS_KEY__   certificate and key for this host, as for the other hosts
server {
    listen 80;
    listen [::]:80;
    server_name mrtravels.get4domain.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mrtravels.get4domain.com;
    server_tokens off;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/cloudflare-realip.conf;
    include snippets/g4d-gzip.conf;

    client_max_body_size 10m;

    access_log /var/log/nginx/mrtravels.get4domain.com.access.log;
    error_log  /var/log/nginx/mrtravels.get4domain.com.error.log;

    location / {
        proxy_pass __MRTRAVELS_UPSTREAM__;
        include snippets/g4d-proxy.conf;
    }
}
