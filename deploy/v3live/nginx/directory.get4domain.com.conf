# directory.get4domain.com -> the Next public site (E1c). Install as /etc/nginx/sites-available/directory.get4domain.com.conf, then fill the __PLACEHOLDERS__ (RUNBOOK.md).
# The Host header is passed on unchanged: the site decides what to serve from it (V3 host routing). With V3_PUBLIC_ENABLED=false the site answers 404 for the new routes.
server {
    listen 80;
    listen [::]:80;
    server_name directory.get4domain.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name directory.get4domain.com;
    server_tokens off;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/cloudflare-realip.conf;
    include snippets/g4d-gzip.conf;

    client_max_body_size 2m;

    access_log /var/log/nginx/directory.get4domain.com.access.log;
    error_log  /var/log/nginx/directory.get4domain.com.error.log;

    location / {
        proxy_pass http://__V3_BIND_IP__:3006;
        include snippets/g4d-proxy.conf;
        include snippets/g4d-headers-site.conf;
    }
}
