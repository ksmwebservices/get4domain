# Compression for proxied text responses (install as /etc/nginx/snippets/g4d-gzip.conf; include inside a server block).
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;
