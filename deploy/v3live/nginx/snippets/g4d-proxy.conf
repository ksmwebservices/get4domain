# Shared proxy settings for every V3 host (install as /etc/nginx/snippets/g4d-proxy.conf). Include it INSIDE a location, together with a proxy_pass.
# $remote_addr is the real visitor address here, because cloudflare-realip.conf (made by update-cloudflare-ips.sh) restores it from CF-Connecting-IP for Cloudflare peers only.
# X-Forwarded-For is SET, not appended: a visitor cannot put an address in front of the real one, and the API walks it from the right against TRUSTED_PROXIES.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_redirect off;
