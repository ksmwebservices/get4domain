# Headers for the public site host (directory, later the main site and vendor sites): install as /etc/nginx/snippets/g4d-headers-site.conf; include inside the location that proxies.
# The robots rules of these pages are decided by the application (the directory is noindex until the owner approves), so X-Robots-Tag is NOT touched here.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
