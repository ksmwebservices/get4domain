# Headers for the three SPA hosts (app, admin, partner): install as /etc/nginx/snippets/g4d-headers-spa.conf; include inside the location that proxies.
# The SPA container already sends its own Content-Security-Policy, X-Frame-Options, nosniff and Referrer-Policy: this proxy must NOT add or hide those (a second CSP would
# intersect with the first). It adds only the transport header, and it replaces X-Robots-Tag with one value so there is never a duplicate. These hosts are never indexed.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Robots-Tag;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Robots-Tag "noindex, nofollow" always;
