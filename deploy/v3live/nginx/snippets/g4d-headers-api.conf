# Security headers for the API host (install as /etc/nginx/snippets/g4d-headers-api.conf; include inside the location that proxies).
# Each header is hidden from the upstream first and then set once, so the visitor never gets a duplicate. Access-Control-* and Content-Disposition are NOT touched:
# the API sets them, and downloads keep their file name only if they pass through.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
