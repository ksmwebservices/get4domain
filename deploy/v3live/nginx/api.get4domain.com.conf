# api.get4domain.com -> the V3 API (E1c). Install as /etc/nginx/sites-available/api.get4domain.com.conf, then fill the three __PLACEHOLDERS__ with sed (RUNBOOK.md).
#   __V3_BIND_IP__   the LXD container's address (where the apps are published)
#   __TLS_CERT__     path of the certificate chain for this host (the owner's usual way)
#   __TLS_KEY__      path of its private key
# Needs the snippets in deploy/v3live/nginx/snippets/ and the generated cloudflare-realip.conf in /etc/nginx/snippets/.
server {
    listen 80;
    listen [::]:80;
    server_name api.get4domain.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.get4domain.com;
    server_tokens off;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/cloudflare-realip.conf;
    include snippets/g4d-gzip.conf;

    # Uploads go through the API. Must be at least the largest file the admin upload settings allow (storagePrivateMaxBytes and the public limit); raise it together with them.
    client_max_body_size 25m;

    access_log /var/log/nginx/api.get4domain.com.access.log;
    error_log  /var/log/nginx/api.get4domain.com.error.log;

    location / {
        proxy_pass http://__V3_BIND_IP__:3008;
        include snippets/g4d-proxy.conf;
        include snippets/g4d-headers-api.conf;
    }
}
