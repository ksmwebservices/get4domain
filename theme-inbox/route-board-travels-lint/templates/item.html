<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<header class="site-header">
  <div class="wrap head-row">
    <a class="brand" href="/">
      <img data-g4d-if="site.logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="160" height="48" loading="lazy" decoding="async">
      <svg class="brand-mark" data-g4d-if-not="site.logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="14" fill="#0B6B3A"/><path d="M10 40h44l-4-12H18z" fill="#FFB000" stroke="#10201A" stroke-width="3" stroke-linejoin="round"/><circle cx="21" cy="42" r="5" fill="#fff" stroke="#10201A" stroke-width="3"/><circle cx="43" cy="42" r="5" fill="#fff" stroke="#10201A" stroke-width="3"/><path d="M26 22h12" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
      <span class="brand-name">{{site.name}}</span>
    </a>
    <g4d-header-nav label="Main"></g4d-header-nav>
    <g4d-action class="btn btn--go btn--sm"></g4d-action>
  </div>
</header>
<main id="main">
  <section class="page-hero"><div class="wrap"><h1>{{item.name}}</h1></div></section>
  <section class="section" data-g4d-section="detail" data-g4d-label="Package details" data-g4d-optional="false">
    <div class="wrap detail-grid">
      <div>
        <img class="detail-img" data-g4d-if="item.image" src="{{item.image}}" alt="{{item.name}}" width="1200" height="675" fetchpriority="high">
        <div class="prose"><p>{{item.description}}</p></div>
        <div data-g4d-if="item.includes" style="margin-top:22px"><p class="lede">{{item.includes}}</p></div>
        <div data-g4d-if="steps"><h2 style="margin:34px 0 18px;font-size:1.5rem">{{ui.process}}</h2><ol class="steps"><template data-g4d-each="steps"><li><span class="n"><i>{{step.n}}</i></span><h3>{{step.title}}</h3><p>{{step.desc}}</p></li></template></ol></div>
        <div data-g4d-if="faqs" class="faq" style="margin-top:34px"><template data-g4d-each="faqs"><details><summary>{{faq.q}}</summary><p>{{faq.a}}</p></details></template></div>
      </div>
      <aside class="aside-card">
        <div class="price" data-g4d-if="item.price">{{item.price}}</div>
        <p class="meta"><span data-g4d-if="item.duration">{{item.duration}}</span><span data-g4d-if="item.category">{{item.category}}</span></p>
        <g4d-action class="btn btn--go"></g4d-action>
        <a class="btn btn--wa" data-g4d-if="contact.whatsappHref" href="{{contact.whatsappHref}}">{{ui.whatsapp}}</a>
        <a class="btn" data-g4d-if="contact.phone" href="{{contact.phoneHref}}">{{ui.call}} {{contact.phone}}</a>
      </aside>
    </div>
  </section>
  <section class="section section--white" data-g4d-section="enquiry" data-g4d-label="Enquiry" data-g4d-optional="true"><div class="wrap"><g4d-enquiry-form></g4d-enquiry-form></div></section>
</main>
<g4d-footer variant="columns"></g4d-footer>
<g4d-listed-on-badge></g4d-listed-on-badge>
<g4d-share-qr></g4d-share-qr>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
