<a class="skip-link" href="#main">{{ui.skip}}</a>
<header class="site-header">
  <a class="brand" href="/" aria-label="{{ui.home}}">
    <span class="brand__logo" data-g4d-if="site.logo"><img src="{{site.logo}}" alt="{{site.logoAlt}}" width="156" height="48" loading="lazy" decoding="async"></span>
    <span class="brand__name" data-g4d-if-not="site.logo">{{site.name}}</span>
  </a>
  <g4d-header-nav label="{{ui.menu}}"></g4d-header-nav>
  <g4d-action class="header-action" label="{{ui.call}}"></g4d-action>
</header>
<main id="main">
  <section class="page-intro" data-g4d-section="page-intro" data-g4d-label="Services introduction" data-g4d-optional="false"><p class="eyebrow">{{terms.items}}</p><h1>{{page.title}}</h1><p>{{page.intro}}</p></section>
  <section class="section" data-g4d-section="service-list" data-g4d-label="Service catalogue" data-g4d-optional="false" data-g4d-if="items"><div class="service-bento service-bento--listing"><template data-g4d-each="items"><article class="service-card"><div class="service-card__image" data-g4d-if="item.image"><img src="{{item.image}}" alt="{{item.name}}" width="640" height="440" loading="lazy" decoding="async"></div><div class="service-card__body"><span class="card-index">{{n}}</span><h2>{{item.name}}</h2><p class="service-card__description">{{item.description}}</p><p class="service-card__price" data-g4d-if="item.price">{{item.price}}</p><a class="text-link" href="{{item.href}}">{{ui.readMore}}</a></div></article></template></div></section>
  <section class="contact-panel" data-g4d-section="service-enquiry" data-g4d-label="Service enquiry" data-g4d-optional="false"><div><p class="eyebrow">{{ui.contact}}</p><h2>{{cta.label}}</h2><p>{{page.intro}}</p></div><g4d-enquiry-form></g4d-enquiry-form></section>
</main>
<footer class="site-footer">
  <div class="footer__brand"><strong>{{site.name}}</strong><p>{{site.tagline}}</p></div>
  <div class="footer__links"><a href="/about">{{ui.about}}</a><a href="/gallery">{{ui.gallery}}</a><a href="/contact">{{ui.contact}}</a></div>
  <g4d-listed-on-badge></g4d-listed-on-badge>
  <g4d-share-qr></g4d-share-qr>
  <g4d-footer variant="columns"></g4d-footer>
</footer>
<g4d-whatsapp-float></g4d-whatsapp-float>
<g4d-bottom-nav></g4d-bottom-nav>
