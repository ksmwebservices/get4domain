<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<div class="topbar"><div class="container"><span data-g4d-if="contact.address">&#10022; {{contact.address}}</span><g4d-open-now></g4d-open-now></div></div>
<header class="nav-wrap"><div class="container nav"><a class="brand" href="/"><span class="brand-mark" data-g4d-if-not="site.logo" aria-hidden="true"></span><img class="brand-logo" data-g4d-if="site.logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="38" height="38" loading="lazy" decoding="async"><span class="brand-name">{{site.name}}</span></a><g4d-header-nav class="nav-links" label="Main"></g4d-header-nav><div class="nav-actions"><a class="phone" data-g4d-if="contact.phone" href="{{contact.phoneHref}}">{{contact.phone}}</a><g4d-action class="btn small"></g4d-action></div></div></header>
<main id="main">
<section class="page-hero" data-g4d-section="intro" data-g4d-label="Heading" data-g4d-optional="false"><div class="container page-hero-grid"><div><span class="eyebrow">{{site.name}}</span><h1>{{page.title}}</h1><p class="lead" data-g4d-if="page.intro">{{page.intro}}</p><g4d-action class="btn"></g4d-action></div><img data-g4d-if="about.image" src="{{about.image}}" alt="{{about.imageAlt}}" width="1000" height="667" loading="lazy" decoding="async"></div></section>
<section class="section" data-g4d-section="service-list" data-g4d-label="Services" data-g4d-optional="false" data-g4d-if="items"><div class="container"><div class="section-head"><div><span class="eyebrow">{{site.name}}</span><h2>{{terms.items}}</h2></div></div><template data-g4d-each="groups"><div class="group" id="g-{{group.slug}}"><div class="group-head"><span class="eyebrow">{{terms.items}}</span><h2>{{group.name}}</h2></div><div class="service-detail"><template data-g4d-each="group.items"><article class="detail-card" data-g4d-item="{{item.id}}"><div class="detail-icon" aria-hidden="true">{{item.initial}}</div><div><h3><a href="{{item.href}}">{{item.name}}</a></h3><p data-g4d-if="item.description">{{item.description}}</p><strong data-g4d-if="item.price">{{item.price}}</strong></div></article></template></div></div></template><div class="service-detail" data-g4d-if-not="groups"><template data-g4d-each="items"><article class="detail-card" data-g4d-item="{{item.id}}"><div class="detail-icon" aria-hidden="true">{{item.initial}}</div><div><h3><a href="{{item.href}}">{{item.name}}</a></h3><p data-g4d-if="item.description">{{item.description}}</p><strong data-g4d-if="item.price">{{item.price}}</strong></div></article></template></div></div></section>
<section class="section section--blocks" id="price-list" data-g4d-section="category-details" data-g4d-label="Details" data-g4d-optional="true" data-g4d-if="blocks"><div class="container"><template data-g4d-each="blocks"><div class="block" data-block="{{block.key}}"><div class="section-head"><div><span class="eyebrow">{{terms.items}}</span><h2>{{block.title}}</h2></div></div><table class="price-table"><tbody><template data-g4d-each="block.items"><tr><td>{{entry.title}}</td><td>{{entry.detail}}</td><td><strong>{{entry.price}}</strong></td></tr></template></tbody></table></div></template></div></section>
<section class="section areas" id="areas" data-g4d-section="areas" data-g4d-label="Service areas" data-g4d-optional="true" data-g4d-if="areas"><div class="container area-grid"><div><span class="eyebrow">{{site.name}}</span><h2>{{contact.city}}</h2><div class="area-list"><template data-g4d-each="areas"><span class="area-pill">{{area.name}}</span></template></div></div><div class="area-art"><div class="pin-card"><div class="pin" aria-hidden="true">&#8982;</div><g4d-map></g4d-map></div></div></div></section>
<section class="section" id="booking" data-g4d-section="booking" data-g4d-label="Enquiry" data-g4d-optional="true"><div class="container contact-grid contact-grid--light"><div><span class="eyebrow">{{site.name}}</span><h2>{{ui.contact}}</h2><p class="lead" data-g4d-if="site.tagline">{{site.tagline}}</p><g4d-booking></g4d-booking></div><div class="contact-box"><h3>{{site.name}}</h3><div class="contact-row" data-g4d-if="contact.phone"><span aria-hidden="true">&#9742;</span><strong>{{contact.phone}}</strong></div><div class="contact-row" data-g4d-if="contact.email"><span aria-hidden="true">&#9993;</span><strong>{{contact.email}}</strong></div><g4d-action class="btn btn-block"></g4d-action></div></div></section>
<section class="section section--more" data-g4d-section="reviews" data-g4d-label="Reviews and enquiry" data-g4d-optional="true"><div class="container more-grid"><g4d-reviews></g4d-reviews><g4d-enquiry-form></g4d-enquiry-form></div></section>
</main>
<div class="footer"><div class="container footer-grid"><a class="brand" href="/"><span class="brand-name">{{site.name}}</span></a><g4d-footer variant="minimal"></g4d-footer><div class="footer-extra"><g4d-listed-on-badge></g4d-listed-on-badge><g4d-share-qr></g4d-share-qr></div></div></div>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
