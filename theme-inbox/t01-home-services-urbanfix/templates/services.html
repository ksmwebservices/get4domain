<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<div class="topbar"><div class="container"><span class="topbar__text" data-g4d-if="contact.address">&#10022; {{contact.address}}</span><g4d-open-now></g4d-open-now></div></div>
<header class="nav-wrap"><div class="container nav">
  <a class="brand" href="/"><span class="brand-mark" data-g4d-if-not="site.logo" aria-hidden="true"></span><img data-g4d-if="site.logo" class="brand-logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="156" height="48" loading="lazy" decoding="async"><span class="brand-name">{{site.name}}</span></a>
  <g4d-header-nav label="Main"></g4d-header-nav>
  <div class="nav-actions"><a class="phone" data-g4d-if="contact.phone" href="{{contact.phoneHref}}">{{contact.phone}}</a><g4d-action class="btn small"></g4d-action></div>
</div></header>
<main id="main">
<section class="page-hero" data-g4d-section="intro" data-g4d-label="Heading" data-g4d-optional="false"><div class="container page-hero-grid">
  <div><span class="eyebrow">{{site.name}}</span><h1>{{page.title}}</h1><p class="lead" data-g4d-if="page.intro">{{page.intro}}</p><g4d-action class="btn"></g4d-action></div>
  <div class="page-hero__art" aria-hidden="true"><span class="page-hero__ring"></span></div>
</div></section>
<section class="section" data-g4d-section="service-list" data-g4d-label="Services" data-g4d-optional="false" data-g4d-if="items"><div class="container">
  <nav class="chips" data-g4d-if="groups"><template data-g4d-each="groups"><a class="chip" href="#g-{{group.slug}}">{{group.name}}<span class="chip__count">{{group.count}}</span></a></template></nav>
  <template data-g4d-each="groups"><div class="group" id="g-{{group.slug}}">
    <div class="section-head"><div><span class="eyebrow">{{terms.items}}</span><h2>{{group.name}}</h2></div></div>
    <div class="service-detail"><template data-g4d-each="group.items"><article class="detail-card"><div class="detail-icon" aria-hidden="true">{{item.initial}}</div><div class="detail-copy"><h3><a href="{{item.href}}">{{item.name}}</a></h3><p data-g4d-if="item.description">{{item.description}}</p><div class="detail-foot"><strong data-g4d-if="item.price">{{item.price}}</strong><g4d-action class="text-link"></g4d-action></div></div></article></template></div>
  </div></template>
  <div class="service-detail" data-g4d-if-not="groups"><template data-g4d-each="items"><article class="detail-card"><div class="detail-icon" aria-hidden="true">{{item.initial}}</div><div class="detail-copy"><h3><a href="{{item.href}}">{{item.name}}</a></h3><p data-g4d-if="item.description">{{item.description}}</p><div class="detail-foot"><strong data-g4d-if="item.price">{{item.price}}</strong><g4d-action class="text-link"></g4d-action></div></div></article></template></div>
</div></section>
<section class="section section--blocks" id="details" data-g4d-section="category-details" data-g4d-label="Details" data-g4d-optional="true" data-g4d-if="blocks"><div class="container">
  <template data-g4d-each="blocks"><div class="block" data-block="{{block.key}}">
    <div class="section-head"><div><span class="eyebrow">{{terms.items}}</span><h2>{{block.title}}</h2></div></div>
    <div class="block-rows"><template data-g4d-each="block.items"><div class="block-row"><div><strong>{{entry.title}}</strong><p data-g4d-if="entry.detail">{{entry.detail}}</p></div><span class="block-row__price" data-g4d-if="entry.price">{{entry.price}}</span></div></template></div>
  </div></template>
</div></section>
<section class="section" id="booking" data-g4d-section="booking" data-g4d-label="Enquiry" data-g4d-optional="true"><div class="container contact-grid contact-grid--light">
  <div><span class="eyebrow">{{site.name}}</span><h2>{{ui.contact}}</h2><p class="lead" data-g4d-if="site.tagline">{{site.tagline}}</p><g4d-booking></g4d-booking></div>
  <g4d-enquiry-form></g4d-enquiry-form>
</div></section>
</main>
<div class="footer"><div class="container footer-grid">
  <a class="brand" href="/"><span class="brand-name">{{site.name}}</span></a>
  <g4d-footer variant="columns"></g4d-footer>
  <div class="footer-extra"><g4d-listed-on-badge></g4d-listed-on-badge><g4d-share-qr></g4d-share-qr></div>
  <small class="copy">&copy; {{site.year}} {{site.name}}</small>
</div></div>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
