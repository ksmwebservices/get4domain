# ============================================================
# KSM QUANTUM — Nginx (host: ksmquantum.get4domain.com → app on 127.0.0.1:3014)
# Live file on the VM: /etc/nginx/sites-available/ksmquantum
#   ln -s /etc/nginx/sites-available/ksmquantum /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT — Cloudflare SSL/TLS mode is "Flexible" (Cloudflare↔origin is plain HTTP;
# Cloudflare terminates HTTPS to visitors). So the origin must SERVE plain HTTP on :80 and
# must NOT force an HTTP→HTTPS redirect — otherwise Cloudflare (HTTP) ↔ origin (301→HTTPS)
# loops forever. This mirrors the working get4domain_mvp / mrtravels blocks exactly.
#
# Do NOT re-run `certbot --nginx` here: it re-inserts the port-80 "return 301 https" block
# that caused the loop. Keep the zone on "Flexible".
# ============================================================

server {
    listen 80;
    server_name ksmquantum.get4domain.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://localhost:3014;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static {
        proxy_pass http://localhost:3014;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# The certbot-issued cert for ksmquantum.get4domain.com stays installed and can remain in a
# separate `listen 443 ssl` server block if desired — it is simply unused while the zone is
# "Flexible" (Cloudflare never talks HTTPS to the origin). The ONLY required change from
# certbot's output is: the :80 block above must proxy directly (no `return 301 https://…`).
