services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ksm_quantum
    restart: unless-stopped
    ports:
      - "3014:3014"
    environment:
      - NODE_ENV=production
      - PORT=3014
    networks:
      - ksm_quantum_net

networks:
  ksm_quantum_net:
    driver: bridge
