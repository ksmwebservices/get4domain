# ============================================================
# INDIAN AMBULANCE - Nginx (host: indianambulance.get4domain.com -> app on 127.0.0.1:3017)
# Live file on the VM: /etc/nginx/sites-available/indianambulance
#   sudo ln -s /etc/nginx/sites-available/indianambulance /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Same shape as the other vendor vhosts (stepnrock, deebiphotography, ksmquantum): plain HTTP on :80.
# Cloudflare SSL/TLS mode on this zone is "Flexible", so Cloudflare terminates HTTPS and talks plain HTTP to this origin.
# Do NOT add an HTTP->HTTPS redirect and do NOT run certbot for this host (it would loop under Flexible mode).
# ============================================================

server {
    listen 80;
    server_name indianambulance.get4domain.com;

    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://localhost:3017;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static {
        proxy_pass http://localhost:3017;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
