version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: get4domain_frontend
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      # Website Manager: the API asks this app to refresh a vendor's cached pages after Publish. Put the same value in backend-api/.env.local (REVALIDATE_SECRET) and in get4domain_mvp/.env
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
    networks:
      - get4domain_net

networks:
  get4domain_net:
    driver: bridge
