<section id="gallery" class="sec" data-g4d-section="gallery" data-g4d-label="Gallery" data-g4d-optional="true" data-g4d-if="gallery">
  <div class="wrap">
    <h2 class="sec-title">{{ui.gallery}}</h2>
    <ul class="gallery"><template data-g4d-each="gallery"><li><figure class="shot" id="photo-{{image.n}}"><a class="shot-close" href="#gallery">{{ui.closeImage}}</a><a class="thumb" href="#photo-{{image.n}}"><img src="{{image.src}}" alt="{{image.alt}}" width="600" height="400" loading="lazy" decoding="async"></a><figcaption data-g4d-if="image.title">{{image.title}}</figcaption></figure></li></template></ul>
  </div>
</section>
