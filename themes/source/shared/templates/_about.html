<section class="sec about" data-g4d-section="about" data-g4d-label="About" data-g4d-optional="true" data-g4d-if="about.text">
  <div class="wrap split">
    <div class="about-copy"><h2 class="sec-title">{{about.title}}</h2><div class="rich">{{about.text}}</div></div>
    <img data-g4d-if="about.image" class="about-img" src="{{about.image}}" alt="{{about.imageAlt}}" width="800" height="600" loading="lazy" decoding="async">
  </div>
</section>
