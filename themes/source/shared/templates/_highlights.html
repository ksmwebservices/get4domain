<section class="sec alt highlights" data-g4d-section="highlights" data-g4d-label="Highlights" data-g4d-optional="true" data-g4d-if="blocks">
  <div class="wrap blocks g4d-reveal"><template data-g4d-each="blocks"><section class="block" data-block="{{block.key}}"><h2>{{block.title}}</h2><ul><template data-g4d-each="block.items"><li><strong>{{entry.title}}</strong> <span class="price" data-g4d-if="entry.price">{{entry.price}}</span> <span class="detail" data-g4d-if="entry.detail">{{entry.detail}}</span></li></template></ul></section></template></div>
</section>
