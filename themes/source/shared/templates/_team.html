<section class="sec" data-g4d-section="team" data-g4d-label="Team" data-g4d-optional="true" data-g4d-if="team">
  <div class="wrap"><h2 class="sec-title">{{terms.team}}</h2><div class="cards-box"><ul class="cards"><template data-g4d-each="team"><li class="card team-card"><img data-g4d-if="member.image" src="{{member.image}}" alt="{{member.name}}" width="200" height="200" loading="lazy" decoding="async"><span class="card-title">{{member.name}}</span><span class="desc">{{member.role}}</span></li></template></ul></div></div>
</section>
