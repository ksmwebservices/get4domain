<section id="contact" class="sec location" data-g4d-section="contact" data-g4d-label="Find us" data-g4d-optional="true">
  <div class="wrap">
    <h2 class="sec-title">{{ui.contact}}</h2>
    <address class="addr addr--big" data-g4d-if="contact.address">{{contact.address}}</address>
    <g4d-map></g4d-map>
    <div class="contact-grid">
      <div class="contact-info">
        <p data-g4d-if="contact.phone"><a href="{{contact.phoneHref}}">{{contact.phone}}</a></p>
        <p data-g4d-if="contact.email"><a href="mailto:{{contact.email}}">{{contact.email}}</a></p>
        <g4d-social></g4d-social>
        <g4d-booking></g4d-booking>
      </div>
      <g4d-enquiry-form></g4d-enquiry-form>
    </div>
  </div>
</section>
