<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/"><img data-g4d-if="site.logo" class="brand-logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="160" height="48" loading="lazy" decoding="async"><span class="brand-name">{{site.name}}</span></a>
    <g4d-header-nav label="Main"></g4d-header-nav>
    <g4d-cart></g4d-cart>
    <g4d-action class="btn btn-primary head-cta"></g4d-action>
  </div>
</header>
<main id="main">
<section class="sec" data-g4d-section="intro" data-g4d-label="Heading" data-g4d-optional="false">
  <div class="wrap"><h1>{{page.title}}</h1><g4d-search></g4d-search></div>
</section>
<section class="sec" data-g4d-section="services" data-g4d-label="Services" data-g4d-optional="true" data-g4d-if="items">
  <div class="wrap">
    
    <ul class="cards g4d-reveal"><template data-g4d-each="items"><li class="card g4d-lift g4d-zoom"><a class="card-link" href="/services/{{item.slug}}"><img data-g4d-if="item.featured" src="{{item.image}}" alt="{{item.name}}" width="400" height="300" loading="lazy"><span class="badge" data-g4d-if="item.badge">{{item.badge}}</span><span class="card-title">{{item.name}}</span><span class="desc" data-g4d-if="item.description">{{item.description}}</span><span class="price" data-g4d-if="item.price">{{item.price}}</span></a></li></template></ul>
  </div>
</section>
<section class="sec" data-g4d-section="products" data-g4d-label="Products" data-g4d-optional="true" data-g4d-if="products"><div class="wrap"><g4d-product-grid limit="12" images="3"></g4d-product-grid></div></section>
</main>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
<g4d-footer variant="columns"></g4d-footer>
