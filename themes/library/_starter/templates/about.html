<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/"><img data-g4d-if="site.logo" class="brand-logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="160" height="48" loading="lazy" decoding="async"><span class="brand-name">{{site.name}}</span></a>
    <g4d-header-nav label="Main"></g4d-header-nav>
    <g4d-cart></g4d-cart>
    <g4d-action class="btn btn-primary head-cta"></g4d-action>
  </div>
</header>
<main id="main">
<section class="sec" data-g4d-section="content" data-g4d-label="About" data-g4d-optional="false">
  <div class="wrap split">
    <div class="about-copy"><h1>{{page.title}}</h1><div class="rich">{{about.text}}</div></div>
    <img data-g4d-if="about.image" class="about-img" src="{{about.image}}" alt="{{about.imageAlt}}" width="800" height="600">
  </div>
</section>
<section class="sec alt" data-g4d-section="process" data-g4d-label="Process" data-g4d-optional="true" data-g4d-if="steps">
  <div class="wrap"><h2 class="sec-title">{{ui.process}}</h2><ol class="steps"><template data-g4d-each="steps"><li><strong>{{step.title}}</strong> <span>{{step.desc}}</span></li></template></ol></div>
</section>
<section class="sec" data-g4d-section="team" data-g4d-label="Team" data-g4d-optional="true" data-g4d-if="team">
  <div class="wrap"><h2 class="sec-title">{{terms.team}}</h2><ul class="cards"><template data-g4d-each="team"><li class="card"><img data-g4d-if="member.image" src="{{member.image}}" alt="{{member.name}}" width="200" height="200" loading="lazy"><span class="card-title">{{member.name}}</span><span class="desc">{{member.role}}</span></li></template></ul></div>
</section>
<section class="sec alt" data-g4d-section="credentials" data-g4d-label="Credentials" data-g4d-optional="true" data-g4d-if="credentials">
  <div class="wrap"><ul class="creds"><template data-g4d-each="credentials"><li><strong>{{credential.title}}</strong> <span>{{credential.detail}}</span></li></template></ul></div>
</section>
</main>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
<g4d-footer variant="columns"></g4d-footer>
