<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/"><img data-g4d-if="site.logo" class="brand-logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="160" height="48"><span class="brand-name">{{site.name}}</span></a>
    <g4d-header-nav label="Main"></g4d-header-nav>
    <g4d-cart></g4d-cart>
    <g4d-action class="btn btn-primary head-cta"></g4d-action>
  </div>
</header>
<main id="main">
<section class="sec" data-g4d-section="intro" data-g4d-label="Heading" data-g4d-optional="false">
  <div class="wrap"><h1>{{page.title}}</h1></div>
</section>
<section id="gallery" class="sec" data-g4d-section="gallery" data-g4d-label="Gallery" data-g4d-optional="true" data-g4d-if="gallery">
  <div class="wrap">
    <h2 class="sec-title">{{ui.gallery}}</h2>
    <ul class="gallery g4d-reveal"><template data-g4d-each="gallery"><li><a class="thumb" href="#photo-{{image.n}}"><img src="{{image.src}}" alt="{{image.alt}}" width="600" height="400" loading="lazy"></a></li></template></ul>
  </div>
  <template data-g4d-each="gallery"><div class="lightbox" id="photo-{{image.n}}" role="dialog" aria-label="{{image.alt}}"><a class="lightbox-close" href="#gallery">{{ui.closeImage}}</a><img src="{{image.src}}" alt="{{image.alt}}" width="600" height="400" loading="lazy"><p data-g4d-if="image.title">{{image.title}}</p></div></template>
</section>
</main>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
<g4d-footer variant="columns"></g4d-footer>
