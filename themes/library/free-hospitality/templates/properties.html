<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/"><img data-g4d-if="site.logo" class="brand-logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="160" height="48" loading="lazy" decoding="async"><span class="brand-name">{{site.name}}</span></a>
    <a class="head-phone" data-g4d-if="contact.phone" href="{{contact.phoneHref}}" data-track="call"><span class="head-phone__label">{{ui.call}}</span> <strong>{{contact.phone}}</strong></a>
    <a class="head-wa" data-g4d-if="contact.whatsappHref" href="{{contact.whatsappHref}}" data-track="whatsapp" rel="noopener noreferrer">{{ui.whatsapp}}</a>
    <g4d-header-nav label="Main"></g4d-header-nav>
    <g4d-cart></g4d-cart>
    <g4d-action class="btn btn-primary head-cta"></g4d-action>
  </div>
</header>
<main id="main">
<section class="sec" data-g4d-section="intro" data-g4d-label="Heading" data-g4d-optional="false">
  <div class="wrap"><h1>{{page.title}}</h1></div>
</section>
<section class="sec services" data-g4d-section="services" data-g4d-label="Services" data-g4d-optional="true" data-g4d-if="items">
  <div class="wrap">
    <h2 class="sec-title">{{terms.items}}</h2>
    <div class="cards-box"><ul class="cards g4d-reveal"><template data-g4d-each="items"><li class="card g4d-lift g4d-zoom"><a class="card-link" href="/services/{{item.slug}}"><img data-g4d-if="item.featured" src="{{item.image}}" alt="{{item.name}}" width="400" height="300" loading="lazy" decoding="async"><span class="badge" data-g4d-if="item.badge">{{item.badge}}</span><span class="card-title">{{item.name}}</span><span class="desc" data-g4d-if="item.description">{{item.description}}</span><span class="price" data-g4d-if="item.price">{{item.price}}</span></a></li></template></ul></div>
  </div>
</section>
<section class="sec alt highlights" data-g4d-section="highlights" data-g4d-label="Highlights" data-g4d-optional="true" data-g4d-if="blocks">
  <div class="wrap blocks g4d-reveal"><template data-g4d-each="blocks"><section class="block" data-block="{{block.key}}"><h2>{{block.title}}</h2><ul><template data-g4d-each="block.items"><li><strong>{{entry.title}}</strong> <span class="price" data-g4d-if="entry.price">{{entry.price}}</span> <span class="detail" data-g4d-if="entry.detail">{{entry.detail}}</span></li></template></ul></section></template></div>
</section>
<section id="gallery" class="sec" data-g4d-section="gallery" data-g4d-label="Gallery" data-g4d-optional="true" data-g4d-if="gallery">
  <div class="wrap">
    <h2 class="sec-title">{{ui.gallery}}</h2>
    <ul class="gallery"><template data-g4d-each="gallery"><li data-g4d-if="image.shown"><figure class="shot" id="photo-{{image.n}}"><a class="shot-close" href="#gallery">{{ui.closeImage}}</a><a class="thumb" href="#photo-{{image.n}}"><img src="{{image.src}}" alt="{{image.alt}}" width="600" height="400" loading="lazy" decoding="async"></a><figcaption data-g4d-if="image.title">{{image.title}}</figcaption></figure></li></template></ul>
  </div>
</section>
<section id="contact" class="sec location" data-g4d-section="contact" data-g4d-label="Find us" data-g4d-optional="true">
  <div class="wrap">
    <h2 class="sec-title">{{ui.contact}}</h2>
    <address class="addr addr--big" data-g4d-if="contact.address">{{contact.address}}</address>
    <g4d-map></g4d-map>
    <div class="contact-grid">
      <div class="contact-info">
        <p data-g4d-if="contact.phone"><a href="{{contact.phoneHref}}">{{contact.phone}}</a></p>
        <p data-g4d-if="contact.email"><a href="mailto:{{contact.email}}">{{contact.email}}</a></p>
        <g4d-social></g4d-social>
        <g4d-booking></g4d-booking>
      </div>
      <g4d-enquiry-form></g4d-enquiry-form>
    </div>
  </div>
</section>
<section class="sec alt" data-g4d-section="share" data-g4d-label="Share" data-g4d-optional="true">
  <div class="wrap closing"><g4d-share-qr></g4d-share-qr><g4d-listed-on-badge></g4d-listed-on-badge></div>
</section>
</main>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
<g4d-footer variant="columns"></g4d-footer>
