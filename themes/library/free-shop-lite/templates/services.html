<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/"><img data-g4d-if="site.logo" class="brand-logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="160" height="48"><span class="brand-name">{{site.name}}</span></a>
    <a class="head-phone" data-g4d-if="contact.phone" href="{{contact.phoneHref}}" data-track="call"><span class="head-phone__label">{{ui.call}}</span> <strong>{{contact.phone}}</strong></a>
    <a class="head-wa" data-g4d-if="contact.whatsappHref" href="{{contact.whatsappHref}}" data-track="whatsapp" rel="noopener noreferrer">{{ui.whatsapp}}</a>
    <g4d-header-nav label="Main"></g4d-header-nav>
    <g4d-cart></g4d-cart>
    <g4d-action class="btn btn-primary head-cta"></g4d-action>
  </div>
</header>
<main id="main">
<section class="sec" data-g4d-section="intro" data-g4d-label="Heading" data-g4d-optional="false">
  <div class="wrap"><h1>{{page.title}}</h1><g4d-search></g4d-search></div>
</section>
<section class="strip offers" data-g4d-section="offers" data-g4d-label="Offers" data-g4d-optional="true" data-g4d-if="offers">
  <div class="wrap"><ul class="offer-strip"><template data-g4d-each="offers"><li><strong>{{offer.title}}</strong> <span class="detail" data-g4d-if="offer.detail">{{offer.detail}}</span></li></template></ul></div>
</section>
<section id="catalogue" class="sec catalogue" data-g4d-section="products" data-g4d-label="Products" data-g4d-optional="true" data-g4d-if="items">
  <div class="wrap">
    <h2 class="sec-title">{{terms.items}}</h2>
    <ul class="chips" data-g4d-if="groups"><template data-g4d-each="groups"><li>{{group.name}}</li></template></ul>
    <g4d-product-grid limit="12"></g4d-product-grid>
    <p class="note-line">{{ui.shippingNote}}</p>
  </div>
</section>
<section class="sec alt highlights" data-g4d-section="highlights" data-g4d-label="Highlights" data-g4d-optional="true" data-g4d-if="blocks">
  <div class="wrap blocks g4d-reveal"><template data-g4d-each="blocks"><section class="block" data-block="{{block.key}}"><h2>{{block.title}}</h2><ul><template data-g4d-each="block.items"><li><strong>{{entry.title}}</strong> <span class="price" data-g4d-if="entry.price">{{entry.price}}</span> <span class="detail" data-g4d-if="entry.detail">{{entry.detail}}</span></li></template></ul></section></template></div>
</section>
<section class="sec alt" data-g4d-section="share" data-g4d-label="Share" data-g4d-optional="true">
  <div class="wrap closing"><g4d-share-qr></g4d-share-qr><g4d-listed-on-badge></g4d-listed-on-badge></div>
</section>
</main>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
<g4d-footer variant="columns"></g4d-footer>
