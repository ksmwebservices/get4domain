<!doctype html>
<html lang="en"><body>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/"><img class="brand-logo" data-g4d-if="site.logo" src="{{site.logo}}" alt=""><span>{{site.name}}</span></a>
    <g4d-header-nav class="nav" label="Main"></g4d-header-nav>
    <g4d-action class="btn btn-primary head-cta"></g4d-action>
  </div>
</header>
<main>
  <section class="page-head"><div class="wrap"><h1>{{terms.team}}</h1><p class="lead" style="margin-top:12px">Experienced, gentle and easy to talk to.</p></div></section>

  <section class="sec"><div class="wrap"><div class="grid">
    <template data-g4d-each="team">
      <article class="card doc">
        <img data-g4d-if="member.image" src="{{member.image}}" alt="{{member.name}}" loading="lazy">
        <h3>{{member.name}}</h3>
        <p class="muted">{{member.role}}</p>
        <p class="desc" data-g4d-if="member.note">{{member.note}}</p>
        <g4d-action class="btn btn-primary" label="Book with us"></g4d-action>
      </article>
    </template>
  </div></div></section>
</main>
<g4d-footer variant="columns"></g4d-footer>
<g4d-bottom-nav></g4d-bottom-nav>
</body></html>
