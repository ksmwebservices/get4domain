<!doctype html>
<html lang="en"><body>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/"><img class="brand-logo" data-g4d-if="site.logo" src="{{site.logo}}" alt=""><span>{{site.name}}</span></a>
    <g4d-header-nav class="nav" label="Main"></g4d-header-nav>
    <g4d-action class="btn btn-primary head-cta"></g4d-action>
  </div>
</header>
<main>
  <section class="page-head"><div class="wrap"><h1>{{page.title}}</h1></div></section>

  <section class="sec"><div class="wrap"><div class="prose" style="margin-top:0">{{page.body}}</div>
  <div style="margin-top:28px"><g4d-action class="btn btn-primary"></g4d-action></div></div></section>
</main>
<g4d-footer variant="columns"></g4d-footer>
<g4d-bottom-nav></g4d-bottom-nav>
</body></html>
