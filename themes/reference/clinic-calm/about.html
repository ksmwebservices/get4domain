<!doctype html>
<html lang="en"><body>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/"><img class="brand-logo" data-g4d-if="site.logo" src="{{site.logo}}" alt=""><span>{{site.name}}</span></a>
    <g4d-header-nav class="nav" label="Main"></g4d-header-nav>
    <g4d-action class="btn btn-primary head-cta"></g4d-action>
  </div>
</header>
<main>
  <section class="page-head"><div class="wrap"><h1>About {{site.name}}</h1></div></section>

  <section class="sec"><div class="wrap split">
    <div><p class="prose" style="margin-top:0">{{about.text}}</p>
      <ul class="trust"><template data-g4d-each="trust"><li>{{point.text}}</li></template></ul>
      <div style="margin-top:22px"><g4d-action class="btn btn-primary"></g4d-action></div></div>
    <div><img class="photo" data-g4d-if="about.image" src="{{about.image}}" alt="{{site.name}}"><img data-g4d-if-not="about.image" class="photo" src="assets/hero-art.svg" alt=""></div>
  </div></section>
  <section class="sec alt" data-g4d-if="steps"><div class="wrap">
    <p class="eyebrow">How it works</p><h2>Your visit, step by step</h2>
    <div class="grid"><template data-g4d-each="steps"><div class="card"><span class="price">Step {{step.n}}</span><h3>{{step.title}}</h3><p class="desc">{{step.desc}}</p></div></template></div>
  </div></section>
</main>
<g4d-footer variant="columns"></g4d-footer>
<g4d-bottom-nav></g4d-bottom-nav>
</body></html>
