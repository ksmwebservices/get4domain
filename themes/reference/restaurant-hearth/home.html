<!doctype html>
<html lang="en"><body>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/"><img class="brand-logo" data-g4d-if="site.logo" src="{{site.logo}}" alt=""><span>{{site.name}}</span></a>
    <g4d-header-nav class="nav" label="Main"></g4d-header-nav>
    <div class="head-tools"><g4d-cart class="cartbtn" label="Cart"></g4d-cart><g4d-action class="btn btn-primary head-cta"></g4d-action></div>
  </div>
</header>
<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <p class="eyebrow">{{site.tagline}}</p>
        <h1>{{hero.title}}</h1>
        <p class="lead" style="margin-top:16px" data-g4d-if="hero.subtitle">{{hero.subtitle}}</p>
        <div class="actions">
          <g4d-action class="btn btn-primary"></g4d-action>
          <a class="btn" href="menu.html">See the menu</a>
        </div>
      </div>
      <div class="hero-art">
        <img class="hero-photo" data-g4d-if="hero.image" src="{{hero.image}}" alt="{{site.name}}">
        <img data-g4d-if-not="hero.image" src="assets/hero-art.svg" alt="">
      </div>
    </div>
  </section>

  <section class="sec" data-g4d-if="groups">
    <div class="wrap">
      <p class="eyebrow">{{terms.groups}}</p>
      <h2>Find something you will love</h2>
      <div class="tiles">
        <template data-g4d-each="groups"><a class="tile" href="menu.html"><strong>{{group.name}}</strong><span>{{group.count}} to choose from</span></a></template>
      </div>
    </div>
  </section>

  <section class="sec alt" data-g4d-if="gallery">
    <div class="wrap">
      <p class="eyebrow">From our kitchen</p>
      <h2>A taste of what is on the table</h2>
      <div class="strip limit"><template data-g4d-each="gallery"><img src="{{image.src}}" alt="{{image.alt}}" loading="lazy"></template></div>
    </div>
  </section>

  <section class="sec" data-g4d-if="testimonials">
    <div class="wrap">
      <p class="eyebrow">Guests say</p>
      <h2>Words from our tables</h2>
      <div class="tiles">
        <template data-g4d-each="testimonials"><blockquote class="tile" style="margin:0">{{testimonial.quote}}<span>{{testimonial.author}}</span></blockquote></template>
      </div>
    </div>
  </section>

  <section class="sec alt" data-g4d-if="hours">
    <div class="wrap split">
      <div><p class="eyebrow">Come hungry</p><h2>When we are open</h2><p class="lead" style="margin-top:12px" data-g4d-if="contact.address">{{contact.address}}</p>
        <div style="margin-top:22px"><g4d-action class="btn btn-primary"></g4d-action></div></div>
      <g4d-hours variant="card" title="Opening hours"></g4d-hours>
    </div>
  </section>
</main>
<g4d-footer variant="columns"></g4d-footer>
<g4d-bottom-nav></g4d-bottom-nav>
</body></html>
