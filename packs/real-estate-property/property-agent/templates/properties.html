<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<header class="site-header h-dark">
  <div class="wrap head-row">
    <a class="brand" href="/">
      <img data-g4d-if="site.logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="160" height="48" loading="lazy" decoding="async">
      <svg class="brand-mark" data-g4d-if-not="site.logo" aria-hidden="true" focusable="false" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#0e5a57"/><path d="M12 32L32 14l20 18" fill="none" stroke="#f2c46b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 30v20h28V30" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><circle cx="32" cy="38" r="4" fill="#f2c46b"/><path d="M32 42v6" stroke="#f2c46b" stroke-width="3" stroke-linecap="round"/></svg>
      <span class="brand-name">{{site.name}}</span>
    </a>
    <g4d-header-nav label="Main"></g4d-header-nav>
    <g4d-action class="btn btn--go btn--sm"></g4d-action>
  </div>
</header>
<main id="main">
  <section class="page-hero"><div class="wrap"><nav class="crumbs" aria-label="Breadcrumb"><a href="/">{{ui.home}}</a><span aria-hidden="true">/</span><a href="/properties">{{terms.items}}</a></nav><h1>{{page.title}}</h1><p data-g4d-if="page.intro">{{page.intro}}</p></div></section>
  <section class="section" data-g4d-section="list" data-g4d-label="Properties" data-g4d-optional="false">
    <div class="wrap">
      <ul class="jump" data-g4d-if="groups"><template data-g4d-each="groups"><li><a href="#group-{{group.slug}}">{{group.name}}</a></li></template></ul>
      <template data-g4d-each="groups"><div class="group" id="group-{{group.slug}}">
        <div class="sec-head"><h2>{{group.name}}</h2><small>{{group.count}}</small></div>
        <div class="cards"><template data-g4d-each="group.items"><article class="card c-tile">
  <div class="card-art" aria-hidden="false"><span class="badge" data-g4d-if="item.badge">{{item.badge}}</span><img data-g4d-if="item.featured" src="{{item.image}}" alt="{{item.name}}" width="640" height="400" loading="lazy"></div>
  <div class="card-body">
    <h3><a href="{{item.href}}">{{item.name}}</a></h3>
    <p class="card-desc">{{item.description}}</p>
    <p class="meta"><span data-g4d-if="item.location">{{item.location}}</span><span data-g4d-if="item.area">{{item.area}}</span><span data-g4d-if="item.bedrooms">{{item.bedrooms}}</span></p>
    <div class="card-foot"><span class="price" data-g4d-if="item.price">{{item.price}}</span><a class="btn btn--sm" href="{{item.href}}">{{ui.readMore}}</a></div>
  </div>
</article></template></div>
      </div></template>
      <div class="cards" data-g4d-if-not="groups"><h2 class="vh">{{terms.items}}</h2><template data-g4d-each="items"><article class="card c-tile">
  <div class="card-art" aria-hidden="false"><span class="badge" data-g4d-if="item.badge">{{item.badge}}</span><img data-g4d-if="item.featured" src="{{item.image}}" alt="{{item.name}}" width="640" height="400" loading="lazy"></div>
  <div class="card-body">
    <h3><a href="{{item.href}}">{{item.name}}</a></h3>
    <p class="card-desc">{{item.description}}</p>
    <p class="meta"><span data-g4d-if="item.location">{{item.location}}</span><span data-g4d-if="item.area">{{item.area}}</span><span data-g4d-if="item.bedrooms">{{item.bedrooms}}</span></p>
    <div class="card-foot"><span class="price" data-g4d-if="item.price">{{item.price}}</span><a class="btn btn--sm" href="{{item.href}}">{{ui.readMore}}</a></div>
  </div>
</article></template></div>
    </div>
  </section>
  <section class="section section--white" data-g4d-section="enquiry" data-g4d-label="Enquiry" data-g4d-optional="true">
<div class="wrap"><g4d-enquiry-form></g4d-enquiry-form></div>
</section>
</main>
<g4d-footer variant="columns"></g4d-footer>
<g4d-listed-on-badge></g4d-listed-on-badge>
<g4d-share-qr></g4d-share-qr>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
