<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<header class="site-header h-bar">
  <div class="wrap head-row">
    <a class="brand" href="/">
      <img data-g4d-if="site.logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="160" height="48" loading="lazy" decoding="async">
      <svg class="brand-mark" data-g4d-if-not="site.logo" aria-hidden="true" focusable="false" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="8" fill="#12304A"/><path d="M12 52V30h14v22M26 52V18h14v34M40 52V26h12v26" fill="none" stroke="#F4B56A" stroke-width="3" stroke-linejoin="round"/><path d="M8 52h48" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M33 8v10M24 11h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      <span class="brand-name">{{site.name}}</span>
    </a>
    <g4d-header-nav label="Main"></g4d-header-nav>
    <g4d-action class="btn btn--go btn--sm"></g4d-action>
  </div>
</header>
<main id="main">
  <section class="page-hero"><div class="wrap"><h1>{{page.title}}</h1><p data-g4d-if="page.intro">{{page.intro}}</p></div></section>
  <section class="section" data-g4d-section="body" data-g4d-label="Page" data-g4d-optional="false">
<div class="wrap prose"><p>{{page.body}}</p></div>
</section>
</main>
<g4d-footer variant="columns"></g4d-footer>
<g4d-listed-on-badge></g4d-listed-on-badge>
<g4d-share-qr></g4d-share-qr>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
