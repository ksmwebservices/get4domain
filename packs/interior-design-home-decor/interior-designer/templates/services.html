<a class="skip-link" href="#main">{{ui.skip}}</a>
<g4d-claim-banner></g4d-claim-banner>
<header class="site-header h-bar">
  <div class="wrap head-row">
    <a class="brand" href="/">
      <img data-g4d-if="site.logo" src="{{site.logo}}" alt="{{site.logoAlt}}" width="160" height="48" loading="lazy" decoding="async">
      <svg class="brand-mark" data-g4d-if-not="site.logo" aria-hidden="true" focusable="false" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="16" fill="#5b2145"/><path d="M14 40h36v8H14zM18 40v-8a6 6 0 016-6h16a6 6 0 016 6v8" fill="none" stroke="#e8c38a" stroke-width="3.5" stroke-linejoin="round"/><path d="M32 8v10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M24 18h16l-3 8H27z" fill="#e8c38a"/></svg>
      <span class="brand-name">{{site.name}}</span>
    </a>
    <g4d-header-nav label="Main"></g4d-header-nav>
    <g4d-action class="btn btn--go btn--sm"></g4d-action>
  </div>
</header>
<main id="main">
  <section class="page-hero"><div class="wrap"><h1>{{page.title}}</h1><p data-g4d-if="page.intro">{{page.intro}}</p></div></section>
  <section class="section" data-g4d-section="list" data-g4d-label="Design services" data-g4d-optional="false">
    <div class="wrap">
      <h2 class="vh">{{terms.items}}</h2>
      <div class="cards"><template data-g4d-each="items"><article class="card c-soft">
  <div class="card-art" aria-hidden="false"><span class="badge" data-g4d-if="item.badge">{{item.badge}}</span><img data-g4d-if="item.featured" src="{{item.image}}" alt="{{item.name}}" width="640" height="400" loading="lazy"></div>
  <div class="card-body">
    <h3><a href="{{item.href}}">{{item.name}}</a></h3>
    <p class="card-desc">{{item.description}}</p>
    <p class="meta"><span data-g4d-if="item.location">{{item.location}}</span><span data-g4d-if="item.area">{{item.area}}</span><span data-g4d-if="item.bedrooms">{{item.bedrooms}}</span></p>
    <div class="card-foot"><span class="price" data-g4d-if="item.price">{{item.price}}</span><a class="btn btn--sm" href="{{item.href}}">{{ui.readMore}}</a></div>
  </div>
</article></template></div>
    </div>
  </section>
  <section class="section section--tint" data-g4d-section="highlights" data-g4d-label="Packages and areas" data-g4d-optional="true" data-g4d-if="blocks">
<div class="wrap blocks">
  <template data-g4d-each="blocks"><section class="block" data-block="{{block.key}}">
    <div class="sec-head"><h2>{{block.title}}</h2></div>
    <ul class="stones"><template data-g4d-each="block.items"><li class="stone"><div class="top">{{entry.title}}</div><div class="body"><b>{{entry.detail}}</b><span data-g4d-if="entry.price">{{entry.price}}</span></div></li></template></ul>
  </section></template>
</div>
</section>
  <section class="section section--white" data-g4d-section="enquiry" data-g4d-label="Enquiry" data-g4d-optional="true">
<div class="wrap"><g4d-enquiry-form></g4d-enquiry-form></div>
</section>
</main>
<g4d-footer variant="columns"></g4d-footer>
<g4d-listed-on-badge></g4d-listed-on-badge>
<g4d-share-qr></g4d-share-qr>
<g4d-bottom-nav></g4d-bottom-nav>
<g4d-whatsapp-float></g4d-whatsapp-float>
